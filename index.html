<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — L'Épopée des Marchés Financiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F0E8;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── NAV ── */
    .nav {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .nav-brand-name {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.01em;
    }

    .nav-brand-role {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3878D2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: white;
    }

    .nav-username {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }

    /* ── TABS ── */
    .tabs-bar {
      background: #ffffff;
      border-bottom: 1px solid #e0d9ce;
      padding: 0 2rem;
      display: flex;
      gap: 0;
    }

    .tab {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.45);
      padding: 16px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      white-space: nowrap;
    }

    .tab.active {
      color: #1a1a2e;
      border-bottom-color: #1a1a2e;
    }

    .tab:hover:not(.active) { color: rgba(26,26,46,0.7); }

    /* ── SUB-TABS ── */
    .sub-tabs-bar {
      background: #ffffff;
      border-bottom: 1px solid #e0d9ce;
      padding: 0 2rem;
      display: flex;
    }

    .sub-tab {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.45);
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .sub-tab.active {
      color: #1a1a2e;
      border-bottom-color: #1a1a2e;
    }

    /* ── PAGE BODY ── */
    .page-body {
      padding: 2.5rem 2rem 4rem;
      max-width: 720px;
    }

    /* ── APERÇU BADGE ── */
    .apercu-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #c8c0b0;
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
      background: #fff;
    }

    .apercu-icon {
      font-size: 14px;
    }

    /* ── PAGE TITLE ── */
    .page-title {
      font-family: 'EB Garamond', serif;
      font-size: 42px;
      font-weight: 400;
      color: #1a1a2e;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 14px;
      color: rgba(26,26,46,0.45);
      margin-bottom: 2.5rem;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: #ddd6ca;
      margin-bottom: 2rem;
    }

    /* ── PROGRESS ── */
    .progress-section { margin-bottom: 2rem; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .q-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.4);
    }

    .score-live {
      font-size: 13px;
      font-weight: 500;
      color: rgba(26,26,46,0.5);
    }

    .progress-bar-bg {
      height: 3px;
      background: #ddd6ca;
      border-radius: 99px;
    }

    .progress-bar-fill {
      height: 3px;
      background: #1a1a2e;
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    /* ── QUESTION CARD ── */
    .question-card {
      background: #ffffff;
      border: 1px solid #ddd6ca;
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 1.25rem;
    }

    .question-num {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.35);
      margin-bottom: 12px;
    }

    .question-text {
      font-family: 'EB Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: #1a1a2e;
      line-height: 1.5;
    }

    /* ── OPTIONS ── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 18px;
      border: 1px solid #ddd6ca;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      transition: all 0.15s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #f0ebe1;
      border-color: #b8b0a0;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #ddd6ca;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: rgba(26,26,46,0.4);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .option-btn.correct {
      border-color: #0F6E56;
      background: #E1F5EE;
    }
    .option-btn.correct .option-letter {
      background: #0F6E56;
      color: white;
      border-color: #0F6E56;
    }

    .option-btn.wrong {
      border-color: #993C1D;
      background: #FAECE7;
    }
    .option-btn.wrong .option-letter {
      background: #993C1D;
      color: white;
      border-color: #993C1D;
    }

    .option-btn.reveal {
      border-color: #0F6E56;
      background: #E1F5EE;
      opacity: 0.7;
    }
    .option-btn.reveal .option-letter {
      background: #0F6E56;
      color: white;
      border-color: #0F6E56;
    }

    .option-btn:disabled { cursor: default; }

    /* ── FEEDBACK ── */
    .feedback {
      display: none;
      padding: 14px 18px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 1.25rem;
      font-style: italic;
    }
    .feedback.show { display: flex; gap: 10px; align-items: flex-start; }
    .feedback.correct {
      background: #E1F5EE;
      color: #085041;
      border-left: 3px solid #0F6E56;
    }
    .feedback.wrong {
      background: #FAECE7;
      color: #4A1B0C;
      border-left: 3px solid #993C1D;
    }

    /* ── NAV AREA ── */
    .nav-area { display: flex; justify-content: flex-end; }

    .btn-next {
      padding: 10px 28px;
      border-radius: 4px;
      background: #1a1a2e;
      color: white;
      border: none;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-next:hover { opacity: 0.85; }
    .btn-next:active { transform: scale(0.98); }

    /* ── RESULTS ── */
    .results-wrap { display: none; }

    .score-row {
      display: flex;
      align-items: center;
      gap: 2rem;
      background: #ffffff;
      border: 1px solid #ddd6ca;
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .score-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'EB Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .score-text h2 {
      font-family: 'EB Garamond', serif;
      font-size: 26px;
      font-weight: 400;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .score-text p {
      font-size: 14px;
      color: rgba(26,26,46,0.5);
      line-height: 1.5;
    }

    .review-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(26,26,46,0.35);
      margin-bottom: 1rem;
    }

    .review-item {
      background: #ffffff;
      border: 1px solid #ddd6ca;
      border-radius: 4px;
      padding: 1rem 1.25rem;
      margin-bottom: 8px;
    }

    .review-q {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a2e;
      margin-bottom: 7px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .review-answer {
      font-size: 13px;
      color: rgba(26,26,46,0.5);
      display: flex;
      gap: 6px;
      align-items: flex-start;
      font-style: italic;
    }

    .review-answer strong { color: rgba(26,26,46,0.75); font-style: normal; }

    .tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .tag-correct { background: #E1F5EE; color: #085041; border: 1px solid #9FE1CB; }
    .tag-wrong { background: #FAECE7; color: #4A1B0C; border: 1px solid #F5C4B3; }

    .btn-retry {
      margin-top: 1.5rem;
      padding: 10px 28px;
      border-radius: 4px;
      border: 1px solid #c8c0b0;
      background: #ffffff;
      color: rgba(26,26,46,0.6);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-retry:hover { background: #f0ebe1; color: #1a1a2e; }

    /* ── FOOTER ── */
    .footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid #ddd6ca;
      font-size: 12px;
      color: rgba(26,26,46,0.3);
    }

    @media (max-width: 600px) {
      .page-body { padding: 1.5rem 1rem 3rem; }
      .page-title { font-size: 32px; }
      .question-text { font-size: 19px; }
      .tabs-bar { gap: 0; overflow-x: auto; }
      .tab { padding: 14px 14px; font-size: 11px; }
      .score-row { flex-direction: column; text-align: center; gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-brand">
      <span class="nav-brand-name">CMP Journal</span>
      <span class="nav-brand-role">Étudiant</span>
    </div>
    <div class="nav-right">
      <div class="nav-avatar">E</div>
      <span class="nav-username">Étudiant</span>
    </div>
  </nav>

  <!-- TABS -->
  <div class="tabs-bar">
    <div class="tab active">Tableau de bord</div>
    <div class="tab">Trades</div>
    <div class="tab">Calendrier</div>
    <div class="tab">Détails</div>
  </div>

  <!-- SUB-TABS -->
  <div class="sub-tabs-bar">
    <div class="sub-tab active">Quiz</div>
  </div>

  <!-- PAGE BODY -->
  <div class="page-body">

    <div class="apercu-badge">
      <span class="apercu-icon">📋</span>
      Quiz
    </div>

    <h1 class="page-title">L'Épopée des Marchés Financiers</h1>
    <p class="page-subtitle">Cours 1 — Validez vos connaissances avant de continuer</p>
    <div class="divider"></div>

    <!-- QUIZ WRAP -->
    <div id="quizWrap">
      <div class="progress-section">
        <div class="progress-meta">
          <span class="q-label" id="qCounter">Question 1 sur 5</span>
          <span class="score-live" id="scoreLive">0 / 5</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar" style="width:20%"></div>
        </div>
      </div>

      <div class="question-card">
        <div class="question-num" id="questionNum">Question 1</div>
        <div class="question-text" id="questionText"></div>
      </div>

      <div class="options" id="optionsWrap"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-area">
        <button class="btn-next" id="btnNext">Suivant →</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-wrap" id="resultsWrap">
      <div class="score-row">
        <div class="score-circle" id="scoreCircle"></div>
        <div class="score-text">
          <h2 id="scoreMsg"></h2>
          <p id="scoreDetail"></p>
        </div>
      </div>
      <div class="review-section-title">Révision des réponses</div>
      <div id="reviewList"></div>
      <button class="btn-retry" onclick="restartQuiz()">↺ Recommencer le quiz</button>
    </div>

  </div>

  <div class="footer">CMP Journal · Cours 1 — L'Épopée des Marchés Financiers</div>

  <script>
    const questions = [
      {
        q: "En quelle année et dans quelle ville la VOC a-t-elle émis les premières actions de l'histoire ?",
        opts: ["1724 à Paris", "1792 à New York", "1602 à Amsterdam", "1850 à Londres"],
        correct: 2,
        explanation: "La Compagnie des Indes orientales néerlandaises (VOC) a émis les premières actions en 1602 à Amsterdam, levant 6,5 millions de florins en quelques semaines."
      },
      {
        q: "Quelle est la différence essentielle entre le marché primaire et le marché secondaire ?",
        opts: [
          "Le marché primaire est réservé aux grandes entreprises, le secondaire aux PME",
          "Sur le marché primaire l'entreprise lève des fonds directement ; sur le secondaire les investisseurs s'échangent des titres entre eux",
          "Le marché primaire concerne les actions, le secondaire les obligations",
          "Le marché primaire est électronique, le secondaire se fait à la criée"
        ],
        correct: 1,
        explanation: "Lors d'une IPO (marché primaire), l'entreprise reçoit les fonds. Ensuite, les transactions se font entre investisseurs sur le marché secondaire — l'entreprise ne reçoit plus rien."
      },
      {
        q: "Parmi les classes d'actifs suivantes, laquelle représente un prêt consenti à une entreprise ou à un État en échange de revenus fixes ?",
        opts: ["Les actions (équité)", "Les matières premières", "Les devises (Forex)", "Les obligations (dette)"],
        correct: 3,
        explanation: "Une obligation est un titre de dette : l'investisseur prête de l'argent à l'émetteur et reçoit en retour des intérêts fixes (le coupon) puis le remboursement du capital."
      },
      {
        q: "Qu'est-ce que la liquidité d'un marché financier ?",
        opts: [
          "La quantité de liquidités détenues par une banque centrale",
          "Le volume total des dividendes versés chaque année",
          "La capacité à convertir un investissement en argent rapidement et au prix du marché",
          "Le niveau de volatilité des prix sur une journée"
        ],
        correct: 2,
        explanation: "La liquidité, c'est la facilité de transformer un actif en cash quand on le décide. Une action cotée se vend en millisecondes, contrairement à un appartement qui peut prendre des mois."
      },
      {
        q: "Pourquoi dit-on que les marchés financiers sont un « baromètre économique » ?",
        opts: [
          "Car ils mesurent le taux d'inflation en temps réel",
          "Car les prix boursiers intègrent les anticipations collectives sur l'avenir et précèdent souvent les récessions",
          "Car chaque banque centrale publie ses prévisions en bourse",
          "Car le cours de l'or suit toujours la croissance du PIB"
        ],
        correct: 1,
        explanation: "Les marchés agrègent les anticipations de millions d'investisseurs. C'est le mécanisme de découverte des prix : la bourse chute souvent avant une récession car elle anticipe, elle ne réagit pas."
      }
    ];

    let current = 0, score = 0, userAnswers = [];
    const letters = ['A','B','C','D'];

    function renderQuestion() {
      const q = questions[current];
      document.getElementById('progressBar').style.width = ((current+1)/questions.length*100)+'%';
      document.getElementById('qCounter').textContent = `Question ${current+1} sur ${questions.length}`;
      document.getElementById('scoreLive').textContent = `${score} / ${questions.length}`;
      document.getElementById('questionNum').textContent = `Question ${current+1}`;
      document.getElementById('questionText').textContent = q.q;

      const wrap = document.getElementById('optionsWrap');
      wrap.innerHTML = '';
      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
        btn.onclick = () => selectAnswer(i, btn);
        wrap.appendChild(btn);
      });

      const fb = document.getElementById('feedback');
      fb.className = 'feedback';
      fb.innerHTML = '';
      document.getElementById('btnNext').style.display = 'none';
    }

    function selectAnswer(idx, btn) {
      const q = questions[current];
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => b.disabled = true);
      userAnswers.push(idx);

      const fb = document.getElementById('feedback');
      if (idx === q.correct) {
        score++;
        btn.classList.add('correct');
        fb.className = 'feedback correct show';
        fb.innerHTML = `<span>✓</span><span>${q.explanation}</span>`;
      } else {
        btn.classList.add('wrong');
        btns[q.correct].classList.add('reveal');
        fb.className = 'feedback wrong show';
        fb.innerHTML = `<span>✗</span><span>Incorrect. ${q.explanation}</span>`;
      }

      document.getElementById('scoreLive').textContent = `${score} / ${questions.length}`;
      const nextBtn = document.getElementById('btnNext');
      nextBtn.style.display = 'block';
      nextBtn.textContent = current < questions.length - 1 ? 'Suivant →' : 'Voir mes résultats →';
    }

    document.getElementById('btnNext').onclick = () => {
      current++;
      if (current < questions.length) renderQuestion();
      else showResults();
    };

    function showResults() {
      document.getElementById('quizWrap').style.display = 'none';
      document.getElementById('resultsWrap').style.display = 'block';

      const pct = Math.round(score / questions.length * 100);
      const circle = document.getElementById('scoreCircle');
      circle.textContent = `${score} / ${questions.length}`;

      if (pct >= 80) {
        circle.style.background = '#E1F5EE';
        circle.style.color = '#085041';
        circle.style.border = '1px solid #9FE1CB';
        document.getElementById('scoreMsg').textContent = 'Excellent travail !';
        document.getElementById('scoreDetail').textContent = 'Vous maîtrisez bien les fondamentaux de ce chapitre. Vous pouvez passer au suivant.';
      } else if (pct >= 60) {
        circle.style.background = '#FAEEDA';
        circle.style.color = '#633806';
        circle.style.border = '1px solid #FAC775';
        document.getElementById('scoreMsg').textContent = 'Bon résultat !';
        document.getElementById('scoreDetail').textContent = 'Quelques concepts méritent d\'être revus avant de continuer.';
      } else {
        circle.style.background = '#FAECE7';
        circle.style.color = '#4A1B0C';
        circle.style.border = '1px solid #F5C4B3';
        document.getElementById('scoreMsg').textContent = 'À retravailler';
        document.getElementById('scoreDetail').textContent = 'Relisez le chapitre attentivement avant de passer à la suite.';
      }

      const list = document.getElementById('reviewList');
      list.innerHTML = '';
      questions.forEach((q, i) => {
        const ok = userAnswers[i] === q.correct;
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `
          <div class="review-q">
            <span class="tag ${ok ? 'tag-correct' : 'tag-wrong'}">${ok ? '✓' : '✗'}</span>
            <span>${q.q}</span>
          </div>
          <div class="review-answer">
            <span>→</span>
            <span>Bonne réponse : <strong>${q.opts[q.correct]}</strong></span>
          </div>`;
        list.appendChild(div);
      });
    }

    function restartQuiz() {
      current = 0; score = 0; userAnswers = [];
      document.getElementById('quizWrap').style.display = 'block';
      document.getElementById('resultsWrap').style.display = 'none';
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
